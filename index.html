<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Student AI Beta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root { --a:#0d1b3a; --b:#13306b; --ink:#f3f6ff; --ink2:#b9c6e6; --line:rgba(255,255,255,.16); --glass:rgba(255,255,255,.07); --bad:#fca5a5; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 400 16px/1.5 "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
  background: radial-gradient(900px 500px at 80% -10%, var(--b), transparent 60%), var(--a);
  display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.card { width: 100%; max-width: 400px; background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px; backdrop-filter: blur(14px); display: grid; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; }
.mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(145deg,#5b8cff,#2563eb); display: grid; place-items: center; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
p { margin: 0; color: var(--ink2); }
label { font-weight: 600; font-size: .9rem; display: block; margin-bottom: 6px; }
input { width: 100%; font: 500 1.05rem "Plus Jakarta Sans", system-ui, sans-serif; color: var(--ink); background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
input:focus { outline: 3px solid #5b8cff; outline-offset: 1px; }
button { width: 100%; border: 0; border-radius: 12px; padding: 13px; font: 700 1rem "Plus Jakarta Sans", system-ui, sans-serif; background: #fff; color: #0d1b3a; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.msg { min-height: 1.4em; font-size: .9rem; color: var(--bad); }
.foot { font-size: .8rem; }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3 2 8l10 5 10-5-10-5Z" fill="#fff"/><path d="M6 10.5V15c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></span>Student AI</div>
  <h1>Private beta</h1>
  <p>Enter the access code Jett gave you.</p>
  <form id="f" autocomplete="off">
    <label for="code">Access code</label>
    <input id="code" name="code" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="word-word-00" required>
    <p class="msg" id="msg" role="alert"></p>
    <button id="go" type="submit">Unlock</button>
  </form>
  <p class="foot">Don't have a code? Ask Jett.</p>
</main>

const un = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: un(LOCKED.salt), iterations: LOCKED.rounds, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: un(LOCKED.iv) }, key, un(LOCKED.data)));
}
function show(html) { document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), go = document.getElementById("go"), msg = document.getElementById("msg");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const code = document.getElementById("code").value;
  go.disabled = true; go.textContent = "Unlocking…"; msg.textContent = "";
  try {
    const html = await unlock(code);
    try { localStorage.setItem("sa-beta-code", code); } catch {}
    show(html);
  } catch {
    go.disabled = false; go.textContent = "Unlock";
    msg.textContent = "That code didn't work. Check it and try again.";
  }
});
// Remember the code on this device so friends only type it once.
(async () => { let saved = null; try { saved = localStorage.getItem("sa-beta-code"); } catch {}
  if (saved) { try { show(await unlock(saved)); } catch { try { localStorage.removeItem("sa-beta-code"); } catch {} } } })();
